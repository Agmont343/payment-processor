[project]
name = "payment-processor"
version = "0.1.0"
description = "Async payment processing service"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.138.0,<0.139",
    "faststream[rabbit]>=0.6.7,<0.7",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "pydantic>=2.13.4",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DTZ", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic", "fastapi", "faststream", "httpx", "pydantic", "pydantic_settings", "pytest", "sqlalchemy"]

[tool.ruff.format]
quote-style = "double"
